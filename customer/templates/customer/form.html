<!-- customer/form.html -->
<div class="container-fluid">
    <div class="card shadow-sm bg-light text-dark my-5" style="border-radius: 15px;">
        <div class="card-header bg-gray text-dark" style="border-top-left-radius: 15px; border-top-right-radius: 15px;">
            <h5 class="mb-0">Add New Customer</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <!-- Store Field -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Shop <span class="text-danger">*</span>
                        </label>
                        {{ form.store }}
                        <div class="text-danger small">{{ form.store.errors }}</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            First Name <span class="text-danger">*</span>
                        </label>
                        {{ form.first_name }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Last Name
                        </label>
                        {{ form.last_name }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Phone <span class="text-danger">*</span>
                        </label>
                        {{ form.phone }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Email
                        </label>
                        {{ form.email }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Customer Type <span class="text-danger">*</span>
                        </label>
                        {{ form.customer_type }}
                    </div>
                </div>

                <div class="mt-2 d-flex justify-content-between">
                    <a href="{% url 'customer_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-success">
                        Save Customer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
